name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Syntax
        run: for f in *.lua; do luac5.1 -p "$f"; done
      - name: Tests
        run: lua5.1 tests/test.lua
